name: Vigilar Dune 3 en Nuestro Bogotá

on:
  schedule:
    # Todos los días a las 14:00 UTC = 9:00 a. m. hora de Bogotá
    - cron: '0 14 * * *'
  workflow_dispatch: {}   # Permite ejecutarlo manualmente desde Actions

jobs:
  revisar-cartelera:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar chequeo
        env:
          DUNE_EMAIL_FROM: ${{ secrets.DUNE_EMAIL_FROM }}
          DUNE_EMAIL_PASSWORD: ${{ secrets.DUNE_EMAIL_PASSWORD }}
          DUNE_EMAIL_TO: ${{ secrets.DUNE_EMAIL_TO }}
        run: python check_dune.py
